<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <!-- Sky gradient (sunset) -->
  <defs>
    <linearGradient id="skySea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="30%" style="stop-color:#FFA07A"/>
      <stop offset="60%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F6FF"/>
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90A4"/>
      <stop offset="100%" style="stop-color:#2C5F6E"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="350" fill="url(#skySea)"/>

  <!-- Sun -->
  <circle cx="960" cy="150" r="80" fill="#FFD93D"/>
  <circle cx="960" cy="150" r="60" fill="#FFF176"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="200" cy="100" rx="60" ry="30"/>
    <ellipse cx="240" cy="90" rx="40" ry="25"/>
    <ellipse cx="170" cy="95" rx="35" ry="20"/>

    <ellipse cx="600" cy="80" rx="50" ry="25"/>
    <ellipse cx="640" cy="70" rx="35" ry="20"/>
    <ellipse cx="570" cy="75" rx="30" ry="18"/>

    <ellipse cx="1400" cy="120" rx="55" ry="28"/>
    <ellipse cx="1440" cy="110" rx="40" ry="22"/>
    <ellipse cx="1370" cy="115" rx="32" ry="18"/>

    <ellipse cx="1700" cy="90" rx="45" ry="22"/>
    <ellipse cx="1740" cy="82" rx="32" ry="18"/>
    <ellipse cx="1675" cy="87" rx="28" ry="15"/>
  </g>

  <!-- Sea background -->
  <rect y="350" width="1920" height="250" fill="url(#sea)"/>

  <!-- Waves layer 1 (back) -->
  <path d="M0,370 Q120,350 240,370 T480,370 T720,370 T960,370 T1200,370 T1440,370 T1680,370 T1920,370 L1920,400 L0,400 Z" fill="#5BA3B8" opacity="0.7"/>

  <!-- Waves layer 2 (middle) -->
  <path d="M0,390 Q100,375 200,390 T400,390 T600,390 T800,390 T1000,390 T1200,390 T1400,390 T1600,390 T1800,390 T1920,390 L1920,420 L0,420 Z" fill="#4A90A4" opacity="0.8"/>

  <!-- Waves layer 3 (front) -->
  <path d="M0,410 Q80,395 160,410 T320,410 T480,410 T640,410 T800,410 T960,410 T1120,410 T1280,410 T1440,410 T1600,410 T1760,410 T1920,410 L1920,440 L0,440 Z" fill="#3D7A91" opacity="0.9"/>

  <!-- Beach/sand -->
  <rect y="540" width="1920" height="60" fill="#F4D03F"/>
  <rect y="535" width="1920" height="8" fill="#E9C63A"/>

  <!-- Beach details (shells, pebbles) -->
  <g fill="#D4A84B" opacity="0.6">
    <circle cx="100" cy="560" r="5"/>
    <circle cx="300" cy="555" r="4"/>
    <circle cx="500" cy="565" r="6"/>
    <circle cx="750" cy="558" r="4"/>
    <circle cx="1000" cy="562" r="5"/>
    <circle cx="1250" cy="556" r="4"/>
    <circle cx="1500" cy="564" r="5"/>
    <circle cx="1750" cy="559" r="4"/>
  </g>

  <!-- Pixel waves foam -->
  <g fill="#FFFFFF" opacity="0.5">
    <rect x="50" y="535" width="8" height="4"/>
    <rect x="58" y="535" width="8" height="4"/>
    <rect x="250" y="538" width="8" height="4"/>
    <rect x="258" y="538" width="8" height="4"/>
    <rect x="450" y="533" width="8" height="4"/>
    <rect x="458" y="533" width="8" height="4"/>
    <rect x="650" y="537" width="8" height="4"/>
    <rect x="658" y="537" width="8" height="4"/>
    <rect x="850" y="534" width="8" height="4"/>
    <rect x="858" y="534" width="8" height="4"/>
    <rect x="1050" y="536" width="8" height="4"/>
    <rect x="1058" y="536" width="8" height="4"/>
    <rect x="1250" y="532" width="8" height="4"/>
    <rect x="1258" y="532" width="8" height="4"/>
    <rect x="1450" y="535" width="8" height="4"/>
    <rect x="1458" y="535" width="8" height="4"/>
    <rect x="1650" y="537" width="8" height="4"/>
    <rect x="1658" y="537" width="8" height="4"/>
    <rect x="1850" y="533" width="8" height="4"/>
    <rect x="1858" y="533" width="8" height="4"/>
  </g>
</svg>
