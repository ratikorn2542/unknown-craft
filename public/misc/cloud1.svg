<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Pixel art cloud -->
  <g fill="#FFFFFF" opacity="0.8">
    <!-- Main cloud body -->
    <rect x="30" y="30" width="20" height="20"/>
    <rect x="50" y="20" width="30" height="30"/>
    <rect x="80" y="15" width="40" height="35"/>
    <rect x="120" y="25" width="25" height="25"/>
    <rect x="145" y="35" width="20" height="15"/>

    <!-- Cloud details -->
    <rect x="40" y="50" width="15" height="10"/>
    <rect x="60" y="50" width="25" height="10"/>
    <rect x="90" y="50" width="30" height="10"/>
    <rect x="125" y="50" width="20" height="10"/>
  </g>
</svg>
