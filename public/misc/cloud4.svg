<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
  <!-- Large dramatic cloud -->
  <g fill="#FFFFFF" opacity="0.85">
    <!-- Cloud puffs -->
    <rect x="20" y="40" width="25" height="25"/>
    <rect x="45" y="25" width="35" height="40"/>
    <rect x="80" y="15" width="50" height="50"/>
    <rect x="130" y="20" width="45" height="45"/>
    <rect x="175" y="30" width="35" height="35"/>
    <rect x="210" y="45" width="20" height="20"/>

    <!-- Lower puffs -->
    <rect x="30" y="65" width="20" height="15"/>
    <rect x="55" y="65" width="30" height="15"/>
    <rect x="90" y="65" width="40" height="15"/>
    <rect x="135" y="65" width="35" height="15"/>
    <rect x="175" y="65" width="28" height="15"/>
    <rect x="208" y="65" width="18" height="12"/>
  </g>
</svg>
