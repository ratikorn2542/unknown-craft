<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="60%" style="stop-color:#E0F6FF"/>
      <stop offset="100%" style="stop-color:#98D8AA"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#sky1)"/>

  <!-- Sun -->
  <circle cx="1600" cy="120" r="60" fill="#FFD93D"/>
  <circle cx="1600" cy="120" r="50" fill="#FFF176"/>

  <!-- Back mountains -->
  <polygon points="0,400 150,280 300,380 450,260 600,360 750,240 900,350 1050,230 1200,340 1350,220 1500,330 1650,250 1800,340 1920,300 1920,600 0,600" fill="#6B8E6B"/>
  <polygon points="0,420 100,320 200,400 350,300 500,390 650,280 800,370 950,270 1100,360 1250,250 1400,350 1550,290 1700,380 1850,310 1920,350 1920,600 0,600" fill="#5A7D5A"/>

  <!-- Front mountains -->
  <polygon points="0,500 200,380 400,480 600,350 800,450 1000,340 1200,440 1400,320 1600,420 1800,350 1920,400 1920,600 0,600" fill="#4A6D4A"/>
  <polygon points="0,520 150,420 350,500 550,400 750,490 950,380 1150,470 1350,370 1550,460 1750,390 1920,430 1920,600 0,600" fill="#3D5C3D"/>

  <!-- Pine trees (pixel style) -->
  <g fill="#2D5A2D">
    <!-- Tree 1 -->
    <polygon points="100,520 120,440 140,520"/>
    <polygon points="110,520 120,470 130,520"/>
    <rect x="115" y="520" width="10" height="20" fill="#5D4037"/>

    <!-- Tree 2 -->
    <polygon points="300,530 325,420 350,530"/>
    <polygon points="312,530 325,460 338,530"/>
    <rect x="320" y="530" width="10" height="25" fill="#5D4037"/>

    <!-- Tree 3 -->
    <polygon points="500,525 515,450 530,525"/>
    <polygon points="507,525 515,480 523,525"/>
    <rect x="512" y="525" width="6" height="15" fill="#5D4037"/>

    <!-- Tree 4 -->
    <polygon points="750,530 780,400 810,530"/>
    <polygon points="760,530 780,440 800,530"/>
    <polygon points="770,530 780,470 790,530"/>
    <rect x="775" y="530" width="10" height="25" fill="#5D4037"/>

    <!-- Tree 5 -->
    <polygon points="1100,520 1120,440 1140,520"/>
    <polygon points="1110,520 1120,470 1130,520"/>
    <rect x="1115" y="520" width="10" height="20" fill="#5D4037"/>

    <!-- Tree 6 -->
    <polygon points="1350,530 1375,420 1400,530"/>
    <polygon points="1362,530 1375,460 1388,530"/>
    <rect x="1370" y="530" width="10" height="25" fill="#5D4037"/>

    <!-- Tree 7 -->
    <polygon points="1600,525 1615,450 1630,525"/>
    <polygon points="1607,525 1615,480 1623,525"/>
    <rect x="1612" y="525" width="6" height="15" fill="#5D4037"/>

    <!-- Tree 8 -->
    <polygon points="1800,530 1830,400 1860,530"/>
    <polygon points="1810,530 1830,440 1850,530"/>
    <polygon points="1820,530 1830,470 1840,530"/>
    <rect x="1825" y="530" width="10" height="25" fill="#5D4037"/>
  </g>

  <!-- Grass foreground -->
  <rect x="0" y="550" width="1920" height="50" fill="#4A7C4A"/>
  <rect x="0" y="545" width="1920" height="8" fill="#5D9B5D"/>

  <!-- Small flowers/grass details -->
  <g fill="#FFD93D">
    <circle cx="50" cy="550" r="4"/>
    <circle cx="150" cy="548" r="3"/>
    <circle cx="280" cy="552" r="4"/>
    <circle cx="420" cy="549" r="3"/>
    <circle cx="580" cy="551" r="4"/>
    <circle cx="720" cy="548" r="3"/>
    <circle cx="890" cy="552" r="4"/>
    <circle cx="1020" cy="550" r="3"/>
    <circle cx="1180" cy="549" r="4"/>
    <circle cx="1340" cy="551" r="3"/>
    <circle cx="1500" cy="548" r="4"/>
    <circle cx="1660" cy="552" r="3"/>
    <circle cx="1820" cy="550" r="4"/>
  </g>
</svg>
