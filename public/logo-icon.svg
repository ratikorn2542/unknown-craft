<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" shape-rendering="crispEdges">
  <!-- Background Shield / Coin Circle -->
  <rect x="8" y="2" width="16" height="2" fill="#2c1d11" />
  <rect x="6" y="4" width="20" height="2" fill="#2c1d11" />
  <rect x="4" y="6" width="24" height="2" fill="#2c1d11" />
  <rect x="4" y="8" width="24" height="16" fill="#2c1d11" />
  <rect x="6" y="24" width="20" height="2" fill="#2c1d11" />
  <rect x="8" y="26" width="16" height="2" fill="#2c1d11" />
  <rect x="10" y="28" width="12" height="2" fill="#2c1d11" />

  <!-- Inner Badge Fill -->
  <rect x="8" y="4" width="16" height="2" fill="#f59e0b" />
  <rect x="6" y="6" width="20" height="2" fill="#f59e0b" />
  <rect x="6" y="8" width="20" height="16" fill="#fbbf24" />
  <rect x="8" y="24" width="16" height="2" fill="#d97706" />
  <rect x="10" y="26" width="12" height="2" fill="#b45309" />

  <!-- Sword -->
  <rect x="5" y="5" width="2" height="2" fill="#f8fafc" />
  <rect x="7" y="7" width="2" height="2" fill="#cbd5e1" />
  <rect x="9" y="9" width="2" height="2" fill="#94a3b8" />
  <rect x="21" y="21" width="2" height="2" fill="#475569" />
  <rect x="23" y="23" width="2" height="2" fill="#78350f" />

  <!-- Cat Ears -->
  <rect x="9" y="10" width="3" height="3" fill="#1e293b" />
  <rect x="10" y="11" width="1" height="1" fill="#f43f5e" />
  <rect x="20" y="10" width="3" height="3" fill="#1e293b" />
  <rect x="21" y="11" width="1" height="1" fill="#f43f5e" />

  <!-- Cat Head -->
  <rect x="10" y="13" width="12" height="9" fill="#1e293b" />
  <rect x="9" y="14" width="14" height="7" fill="#1e293b" />

  <!-- Hero Cap -->
  <rect x="9" y="12" width="14" height="3" fill="#15803d" />
  <rect x="8" y="13" width="2" height="2" fill="#166534" />
  <rect x="22" y="13" width="2" height="2" fill="#166534" />
  <rect x="10" y="12" width="12" height="1" fill="#22c55e" />
  <rect x="7" y="11" width="2" height="3" fill="#ef4444" />
  <rect x="6" y="10" width="2" height="2" fill="#dc2626" />

  <!-- Eyes -->
  <rect x="12" y="16" width="2" height="3" fill="#38bdf8" />
  <rect x="13" y="16" width="1" height="1" fill="#ffffff" />
  <rect x="18" y="16" width="2" height="3" fill="#38bdf8" />
  <rect x="19" y="16" width="1" height="1" fill="#ffffff" />

  <!-- Nose & Snout -->
  <rect x="15" y="18" width="2" height="1" fill="#f43f5e" />
  <rect x="14" y="19" width="4" height="1" fill="#f8fafc" />

  <!-- Cheeks -->
  <rect x="10" y="18" width="2" height="1" fill="#fb7185" opacity="0.6" />
  <rect x="20" y="18" width="2" height="1" fill="#fb7185" opacity="0.6" />

  <!-- Whiskers -->
  <rect x="7" y="17" width="2" height="1" fill="#94a3b8" />
  <rect x="23" y="17" width="2" height="1" fill="#94a3b8" />
  <rect x="8" y="19" width="2" height="1" fill="#94a3b8" />
  <rect x="22" y="19" width="2" height="1" fill="#94a3b8" />

  <!-- Scarf -->
  <rect x="11" y="21" width="10" height="2" fill="#b91c1c" />
  <rect x="10" y="22" width="12" height="2" fill="#ef4444" />
  <rect x="14" y="24" width="4" height="3" fill="#dc2626" />
</svg>
